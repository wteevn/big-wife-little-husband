<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Большая жена, маленький муж</title><style>body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;margin:0;background:#203547;font:16px system-ui;color:white;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none}#ui{position:absolute;top:20px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}#ui span{background:#203547d9;border-radius:12px;padding:10px;max-width:58%}#pad{position:absolute;bottom:20px;left:15px;display:grid;grid-template-columns:55px 55px 55px;gap:5px}button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border:1px solid #ffffff77;border-radius:14px;background:#294b69e8;color:white;font-size:21px;padding:12px;touch-action:none}#buttons{position:absolute;bottom:30px;right:15px;display:grid;gap:10px}#buttons button{font-size:16px;background:#b74355}#msg{position:absolute;top:105px;left:10%;right:10%;text-align:center;background:#203547e8;border-radius:14px;padding:12px;display:none}</style><canvas id="c"></canvas><div id="ui"><span id="task">🌷 Задание: собрать цветы</span><span id="status">👠 Жена ❤️45</span></div><div id="msg"></div><div id="pad"><i></i><button data-k="up">↑</button><i></i><button data-k="left">←</button><button data-k="down">↓</button><button data-k="right">→</button></div><div id="buttons"><button id="swap">🔄 Герой</button><button id="act">✨ Действие</button></div><script>const c=document.querySelector('#c'),g=c.getContext('2d'),t=document.querySelector('#task'),s=document.querySelector('#status'),m=document.querySelector('#msg');let w,h,hero=0,love=45,stage=0,room=0;const WORLD=3200;let p=[{x:440,y:440},{x:520,y:480}],keys={};const tasks=['Собери цветы 🌷','Подари букет супругу ❤️','Зайди в дом 🚪','Приготовь завтрак 🍳','Обними супруга ❤️','Свободная игра 🎉'];function note(v){m.textContent=v;m.style.display='block';setTimeout(()=>m.style.display='none',2300)}function refresh(){t.textContent='Задание: '+tasks[stage];s.textContent=(hero?'👔 Муж':'👠 Жена')+' ❤️'+love}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}document.querySelector('#swap').onclick=()=>{hero=1-hero;refresh()};document.querySelector('#act').onclick=()=>{let a=p[hero],b=p[1-hero];if(stage===0&&dist(a,{x:160,y:470})<120&&!room){stage++;note('🌷 Букет собран!')}else if(stage===1&&dist(a,b)<130){stage++;love+=12;note('❤️ Как приятно!')}else if(stage===2&&dist(a,{x:760,y:350})<130){room=1;stage++;p=[{x:420,y:450},{x:510,y:480}];note('🏠 Вы дома!')}else if(stage===3&&dist(a,{x:700,y:300})<180&&room){stage++;note('🍳 Завтрак готов!')}else if(stage===4&&dist(a,b)<130){stage++;love+=25;note('🎉 Все задания выполнены!')}else if(stage===5&&dist(a,b)<130){love=Math.min(100,love+2);note('❤️ Объятия!')}else note('Подойди ближе к цели задания');refresh()};document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;const stop=e=>{if(e)e.preventDefault();keys[k]=0;b.style.background='#294b69e8'};b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;b.style.background='#3b8b9d';try{b.setPointerCapture(e.pointerId)}catch(_){}});b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);b.addEventListener('touchend',stop,{passive:false});b.addEventListener('touchcancel',stop,{passive:false})});document.addEventListener('visibilitychange',()=>{if(document.hidden)Object.keys(keys).forEach(k=>keys[k]=0)});onkeydown=e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){keys[k]=1;e.preventDefault()}};onkeyup=e=>{let k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k)keys[k]=0};function draw(){if(c.width!==innerWidth||c.height!==innerHeight){c.width=innerWidth;c.height=innerHeight}w=c.width;h=c.height;g.fillStyle=room?'#ead2a9':'#92c98c';g.fillRect(0,0,w,h);let z=Math.min(w/900,h/750),oX=w/2-p[hero].x*z,oY=h/2-p[hero].y*z;g.save();g.translate(oX,oY);g.scale(z,z);g.fillStyle=room?'#f5e5c8':'#e7cfa0';g.fillRect(-1500,-1500,4700,4700);g.font='75px system-ui';g.fillText(room?'🛋️':'🏡',540,240);if(!room){const places=[[-1000,-900,'🏖️','Пляж'],[1100,-900,'🏪','Магазин'],[-1050,1000,'🎡','Парк'],[1100,1050,'🏘️','Деревня'],[100,1200,'☕','Кафе']];for(const [px,py,emoji,name] of places){g.fillStyle='#e2c49a';g.beginPath();g.arc(px,py,175,0,Math.PI*2);g.fill();g.textAlign='center';g.font='110px system-ui';g.fillText(emoji,px,py);g.fillStyle='#25382e';g.font='bold 42px system-ui';g.fillText(name,px,py+65)}g.strokeStyle='#c1a77d';g.lineWidth=65;g.beginPath();g.moveTo(-1100,-900);g.lineTo(0,0);g.lineTo(1100,-900);g.moveTo(0,0);g.lineTo(-1050,1000);g.moveTo(0,0);g.lineTo(1100,1050);g.stroke()}if(!room){for(let j=0;j<60;j++){let x=((j*593+97)%3100)-1400,y=((j*977+213)%3100)-1400;g.font='55px system-ui';g.fillText(j%4===0?'🌲':j%4===1?'🌼':j%4===2?'🌳':'🌿',x,y)}}g.fillText(room?'🍳':'🌷',room?650:110,room?310:470);if(!room)g.fillText('🚪',715,350);for(let i=0;i<2;i++){let a=p[i],big=!i;g.font=(big?160:95)+'px system-ui';g.textAlign='center';g.fillText(big?'👩🏻‍🦱':'👨🏻',a.x,a.y-45);g.fillStyle=big?'#d92c40':'#fff4e4';g.fillRect(a.x-(big?50:23),a.y-(big?50:25),big?100:46,big?110:60);g.fillStyle='#3d2b2c';g.fillRect(a.x-(big?42:18),a.y+(big?60:35),big?35:15,big?55:35);g.fillRect(a.x+7,a.y+(big?60:35),big?35:15,big?55:35);if(i===hero){g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();g.ellipse(a.x,a.y+90,big?70:45,18,0,0,7);g.stroke()}}g.restore();if(!room){g.fillStyle='#203547c9';g.fillRect(8,h*0.18,210,40);g.fillStyle='white';g.font='16px system-ui';g.textAlign='left';g.fillText('Карта: '+Math.round(p[hero].x)+', '+Math.round(p[hero].y),16,h*0.18+26)}let a=p[hero],dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);a.x=Math.max(-1450,Math.min(1550,a.x+dx*10));a.y=Math.max(-1450,Math.min(1550,a.y+dy*10));requestAnimationFrame(draw)}refresh();draw();note('Добро пожаловать! Переключай героев и выполняй задания.');</script></html>
