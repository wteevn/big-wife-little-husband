<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Побег от великанши</title><style>*{box-sizing:border-box}body{margin:0;background:#b7d7b1;font:15px system-ui;color:white;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}#hud>div{background:#213a42e8;border:1px solid #ffffff33;padding:9px 11px;border-radius:12px;max-width:65%}#state{font-size:13px;max-width:40%!important}#controls{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:14px;display:grid;grid-template-columns:56px 56px 56px;gap:5px}button{border:1px solid #ffffff66;border-radius:15px;background:#264b65e9;color:#fff;font-size:24px;height:56px;touch-action:none;-webkit-touch-callout:none}#actions{position:fixed;right:12px;bottom:max(31px,env(safe-area-inset-bottom));display:grid;gap:10px}#actions button{font-size:15px;background:#a92d48e9;min-width:125px}#toast{position:fixed;top:105px;left:10%;right:10%;background:#1b3446e8;border-radius:12px;text-align:center;padding:12px;display:none}#overlay{position:fixed;inset:0;background:#142a3ccf;display:flex;align-items:center;justify-content:center;padding:25px}#panel{background:#f5dfb9;color:#3b2c24;padding:24px;border-radius:20px;max-width:360px;text-align:center;box-shadow:0 15px 50px #0008}#panel h2{margin:0 0 10px}#panel button{background:#b82c42;width:100%;margin-top:12px;font-size:18px}#panel p{line-height:1.5}</style></head><body><canvas id="c"></canvas><div id="hud"><div id="quest">🎯 Доберись до ворот</div><div id="state">👠 Жена ищет тебя</div></div><div id="toast"></div><div id="controls"><span></span><button data-dir="up">↑</button><span></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div id="actions"><button id="hide">🫣 Спрятаться</button><button id="run">🏃 Бежать</button></div><div id="overlay"><div id="panel"><h2>🏡 Побег из дома</h2><p>Ты — крошечный муж огромной великанши. Проберись к воротам, собери ключ и доберись до выхода. Жена сама ходит по двору и пытается поймать тебя!</p><p>Укрывайся за кустами. Кнопка «Бежать» ускоряет тебя, но жена быстрее замечает движение.</p><button id="start">Начать игру</button></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),quest=document.getElementById('quest'),state=document.getElementById('state'),toast=document.getElementById('toast'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
let W=innerWidth,H=innerHeight,playing=false,phase=0,hidden=false,sprint=false,caught=0,last=0,clock=0,noticeTime=0;
const man={x:490,y:740},wife={x:460,y:390,tx:460,ty:390,mode:'patrol',timer:0},keys={};const gate={x:1400,y:220},key={x:1050,y:900},bushes=[{x:620,y:680,r:92},{x:890,y:510,r:95},{x:1170,y:680,r:90},{x:1040,y:1060,r:110},{x:340,y:1120,r:95},{x:1330,y:1060,r:95}];const trees=[{x:200,y:330},{x:800,y:220},{x:1370,y:850},{x:250,y:880}];const rnd=(a,b)=>a+Math.random()*(b-a),d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function say(t){toast.textContent=t;toast.style.display='block';noticeTime=clock+2.5}
function reset(){man.x=490;man.y=740;wife.x=460;wife.y=390;wife.mode='patrol';wife.timer=0;phase=0;hidden=false;sprint=false;playing=true;overlay.style.display='none';updateHud();say('Тихо! Жена вышла во двор...')}
function updateHud(){quest.textContent=phase===0?'🎯 Найди ключ у сарая':phase===1?'🎯 Доберись до ворот':'🏆 Побег удался!';state.textContent=hidden?'🌿 Ты спрятался':wife.mode==='chase'?'🚨 Жена преследует!':wife.mode==='search'?'👀 Жена ищет тебя':'👠 Жена патрулирует'}
document.getElementById('start').onclick=reset;
document.getElementById('hide').onclick=()=>{if(!playing)return;const near=bushes.some(b=>d(man,b)<b.r+25);if(!near){say('Подойди к кустам, чтобы спрятаться');return}hidden=!hidden;say(hidden?'Тсс! Ты спрятался в кустах':'Ты вышел из укрытия');updateHud()};
document.getElementById('run').onpointerdown=e=>{e.preventDefault();sprint=true};document.getElementById('run').onpointerup=document.getElementById('run').onpointercancel=()=>sprint=false;
document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;const off=e=>{if(e)e.preventDefault();keys[k]=false;b.style.background='#264b65e9'};b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.style.background='#438d9e';try{b.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture','touchend'].forEach(ev=>b.addEventListener(ev,off,{passive:false}))});
document.addEventListener('visibilitychange',()=>{if(document.hidden){Object.keys(keys).forEach(k=>keys[k]=false);sprint=false}});
onkeydown=e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){keys[k]=true;e.preventDefault()}if(e.key===' ')sprint=true};onkeyup=e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k)keys[k]=false;if(e.key===' ')sprint=false};
function end(win){playing=false;overlay.style.display='flex';panel.innerHTML=win?'<h2>🏆 Побег удался!</h2><p>Ты добрался до ворот и обхитрил великаншу. Но она уже планирует новую погоню!</p><button id="again">Сыграть ещё</button>':'<h2>👠 Попался!</h2><p>Огромная жена схватила тебя и унесла домой под мышкой. Попробуй спрятаться в кустах и обойти её!</p><button id="again">Попробовать снова</button>';document.getElementById('again').onclick=reset}
function update(dt){if(!playing)return;clock+=dt;if(clock>noticeTime)toast.style.display='none';let vx=(keys.right?1:0)-(keys.left?1:0),vy=(keys.down?1:0)-(keys.up?1:0),n=Math.hypot(vx,vy)||1;const moving=vx||vy;const speed=sprint?260:165;if(moving){hidden=false;man.x=cl(man.x+vx/n*speed*dt,60,1530);man.y=cl(man.y+vy/n*speed*dt,85,1330)}
if(phase===0&&d(man,key)<66){phase=1;say('🗝️ Ключ найден! Теперь к воротам');updateHud()}
if(phase===1&&d(man,gate)<85){end(true);return}
wife.timer-=dt;let dist=d(man,wife);const visible=!hidden&&(dist<(sprint?510:360));if(visible){wife.mode='chase';wife.tx=man.x;wife.ty=man.y;wife.timer=2.8}else if(wife.mode==='chase'&&wife.timer<=0){wife.mode='search';wife.timer=3}else if(wife.mode==='search'&&wife.timer<=0){wife.mode='patrol';wife.timer=0}
if(wife.mode==='patrol'&&wife.timer<=0){wife.tx=rnd(180,1400);wife.ty=rnd(200,1180);wife.timer=rnd(2,4)}
if(wife.mode==='chase'){wife.tx=man.x;wife.ty=man.y}
let dx=wife.tx-wife.x,dy=wife.ty-wife.y,dd=Math.hypot(dx,dy);if(dd>4){let v=wife.mode==='chase'?205:95;wife.x+=dx/dd*Math.min(dd,v*dt);wife.y+=dy/dd*Math.min(dd,v*dt)}
if(dist<76&&!hidden){caught++;end(false);return}updateHud()}
function path(){g.fillStyle='#a9cb8c';g.fillRect(0,0,1600,1400);g.fillStyle='#e7c794';g.beginPath();g.moveTo(440,690);g.lineTo(480,750);g.lineTo(1050,900);g.lineTo(1420,230);g.lineTo(1470,230);g.lineTo(1100,970);g.lineTo(460,810);g.closePath();g.fill();g.fillStyle='#e6d6b5';g.fillRect(190,140,510,370);g.fillStyle='#bf664c';g.fillRect(170,115,550,75);g.fillStyle='#633c31';g.fillRect(460,405,100,105);g.fillStyle='#fff1cb';g.fillRect(250,230,100,90);g.fillStyle='#56808c';g.fillRect(263,242,74,67);g.fillStyle='#a57245';g.fillRect(960,760,200,160);g.fillStyle='#995738';g.fillRect(930,735,260,42);g.strokeStyle='#8b5b3c';g.lineWidth=24;g.strokeRect(40,40,1520,1320);g.strokeStyle='#4b8b58';g.lineWidth=10;for(let i=50;i<1560;i+=65){g.beginPath();g.moveTo(i,42);g.lineTo(i,72);g.stroke()}g.fillStyle='#794a32';g.fillRect(1340,100,22,220);g.fillRect(1500,100,22,220);g.fillStyle='#6d8c50';g.fillRect(1360,120,140,130);g.fillStyle='#c9b06d';g.font='bold 33px system-ui';g.fillText('ВЫХОД',1360,160)}
function scenery(){for(const a of trees){g.fillStyle='#72503a';g.fillRect(a.x-15,a.y-50,30,110);for(let j=0;j<4;j++){g.fillStyle=j%2?'#498b4c':'#6b9e4b';g.beginPath();g.arc(a.x+Math.sin(j*2)*38,a.y-90+Math.cos(j*2)*30,68,0,7);g.fill()}}for(const b of bushes){g.fillStyle='#367b45';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();g.fillStyle='#5caa5e';for(let j=0;j<5;j++){g.beginPath();g.arc(b.x+Math.sin(j*2.7)*b.r*.55,b.y+Math.cos(j*2.7)*b.r*.55,b.r*.4,0,7);g.fill()}}g.font='54px system-ui';g.fillText('🗝️',key.x-30,key.y);g.font='28px system-ui';g.fillStyle='#513f35';g.fillText('Сарай',990,970)}
function figure(x,y,large){g.save();g.translate(x,y);if(large){g.fillStyle='#3c302c';g.beginPath();g.ellipse(0,-180,46,56,0,0,7);g.fill();g.fillStyle='#f0a26b';g.beginPath();g.arc(0,-184,36,0,7);g.fill();g.fillStyle='#251d20';g.beginPath();g.arc(-12,-190,4,0,7);g.arc(12,-190,4,0,7);g.fill();g.strokeStyle='#6d2029';g.lineWidth=4;g.beginPath();g.moveTo(-12,-168);g.lineTo(10,-168);g.stroke();g.fillStyle='#d72b3d';g.beginPath();g.moveTo(-50,-130);g.quadraticCurveTo(-94,-15,-65,5);g.lineTo(65,5);g.quadraticCurveTo(94,-15,50,-130);g.closePath();g.fill();g.fillStyle='#fff1d5';for(let i=0;i<26;i++){let a=i*2.4;g.beginPath();g.arc(Math.sin(a)*52,-110+(i%6)*20,3.5,0,7);g.fill()}g.strokeStyle='#ed9b65';g.lineWidth=21;g.beginPath();g.moveTo(-45,-112);g.lineTo(-76,-48);g.moveTo(45,-112);g.lineTo(76,-48);g.stroke();g.strokeStyle='#f2a56e';g.lineWidth=28;g.beginPath();g.moveTo(-30,0);g.lineTo(-32,85);g.moveTo(30,0);g.lineTo(32,85);g.stroke();g.fillStyle='#c62535';g.fillRect(-49,76,34,17);g.fillRect(17,76,34,17);g.fillStyle='#e9b02d';g.beginPath();g.arc(-34,-175,8,0,7);g.arc(34,-175,8,0,7);g.fill();g.fillStyle='#d32638';for(let i=-2;i<=2;i++){g.beginPath();g.arc(i*11,-143,6,0,7);g.fill()}}else{g.fillStyle='#473027';g.fillRect(-15,-21,12,29);g.fillRect(3,-21,12,29);g.fillStyle='#f5f0e4';g.fillRect(-19,-80,38,62);g.fillStyle='#784a2c';g.fillRect(-20,-20,40,10);g.fillStyle='#b23c2b';g.beginPath();g.moveTo(-4,-77);g.lineTo(5,-77);g.lineTo(2,-38);g.closePath();g.fill();g.fillStyle='#efb280';g.beginPath();g.arc(0,-96,24,0,7);g.fill();g.fillStyle='#2c1e1b';g.beginPath();g.arc(0,-111,24,Math.PI,6.2);g.fill();g.fillStyle='#2d211d';g.fillRect(-13,-94,26,5);g.fillStyle='#fff';g.beginPath();g.arc(-8,-100,4,0,7);g.arc(8,-100,4,0,7);g.fill();g.fillStyle='#1f1816';g.beginPath();g.arc(-8,-100,2,0,7);g.arc(8,-100,2,0,7);g.fill()}g.restore()}
function render(){W=innerWidth;H=innerHeight;const ratio=Math.min(devicePixelRatio||1,2),cw=Math.round(W*ratio),ch=Math.round(H*ratio);if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch}g.setTransform(ratio,0,0,ratio,0,0);g.fillStyle='#c2dba8';g.fillRect(0,0,W,H);const zoom=Math.min(W/540,H/800)*.95;g.save();g.translate(W/2-man.x*zoom,H/2-man.y*zoom);g.scale(zoom,zoom);path();scenery();figure(wife.x,wife.y,true);if(!hidden)figure(man.x,man.y,false);else{g.fillStyle='#fff';g.font='25px system-ui';g.fillText('👀',man.x-20,man.y-70)}g.restore();g.fillStyle='#263b3ecc';g.fillRect(10,H*.17,165,30);g.fillStyle='white';g.font='14px system-ui';g.fillText('🗝️ '+(phase?'Есть':'Нет')+'   👠 '+Math.round(d(man,wife)),18,H*.17+20)}
function loop(now){const dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
