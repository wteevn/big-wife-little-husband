async function rasterizeWife(){
 try{
  const response=await fetch('assets/wife.svg?contours=3',{cache:'no-store'});
  if(!response.ok)throw Error('SVG HTTP '+response.status);
  const xml=new DOMParser().parseFromString(await response.text(),'image/svg+xml');
  if(xml.querySelector('parsererror'))throw Error('SVG parse error');
  const off=document.createElement('canvas');off.width=250;off.height=610;
  const ctx=off.getContext('2d');
  if(!ctx)throw Error('No canvas');
  const palette={'url(#skin)':'#f3a96f','url(#red)':'#d32a40','url(#dots)':'#fff1df'};
  function color(v){return palette[v]||v||'none'}
  function renderNode(node,style){
   const tag=node.localName;if(!tag||tag==='defs'||tag==='linearGradient'||tag==='pattern'||tag==='stop')return;
   const st={...style};
   for(const name of ['fill','stroke','stroke-width','stroke-linecap','stroke-linejoin','opacity']){
    if(node.hasAttribute(name))st[name]=node.getAttribute(name);
   }
   if(tag==='path'||tag==='circle'){
    ctx.save();ctx.globalAlpha=Number(st.opacity||1);
    ctx.lineWidth=Number(st['stroke-width']||1);ctx.lineCap=st['stroke-linecap']||'butt';ctx.lineJoin=st['stroke-linejoin']||'miter';
    let path;
    if(tag==='path'){path=new Path2D(node.getAttribute('d')||'')}
    else{path=new Path2D();path.arc(Number(node.getAttribute('cx')),Number(node.getAttribute('cy')),Number(node.getAttribute('r')),0,Math.PI*2)}
    const fill=color(st.fill);if(fill!=='none'){ctx.fillStyle=fill;ctx.fill(path)}
    const stroke=color(st.stroke);if(stroke!=='none'){ctx.strokeStyle=stroke;ctx.stroke(path)}
    ctx.restore()
   }
   for(const child of node.children)renderNode(child,st)
  }
  renderNode(xml.documentElement,{fill:'#000000',stroke:'none','stroke-width':'1'});
  // The polka-dot dress is painted using a separate pattern layer in the SVG.
  // Add white dots clipped to the same dress silhouette.
  const dresses=Array.from(xml.querySelectorAll('path')).filter(p=>p.getAttribute('fill')==='url(#dots)');
  for(const dress of dresses){ctx.save();ctx.clip(new Path2D(dress.getAttribute('d')));ctx.fillStyle='#fff4e9';for(let y=145;y<315;y+=31)for(let x=20;x<235;x+=29){ctx.beginPath();ctx.arc(x+9,y+10,4.5,0,Math.PI*2);ctx.fill()}ctx.restore()}
  wifeRaster=off;
 }catch(err){console.warn('Contour raster failed; SVG fallback',err)}
}
