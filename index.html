<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Побег от великанши</title><style>*{box-sizing:border-box}body{margin:0;background:#b7d7b1;font:15px system-ui;color:white;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}#hud>div{background:#213a42e8;border:1px solid #ffffff33;padding:9px 11px;border-radius:12px;max-width:65%}#state{font-size:13px;max-width:40%!important}#controls{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:14px;display:grid;grid-template-columns:56px 56px 56px;gap:5px}button{border:1px solid #ffffff66;border-radius:15px;background:#264b65e9;color:#fff;font-size:24px;height:56px;touch-action:none;-webkit-touch-callout:none}#actions{position:fixed;right:12px;bottom:max(31px,env(safe-area-inset-bottom));display:grid;gap:10px}#actions button{font-size:15px;background:#a92d48e9;min-width:125px}#toast{position:fixed;top:105px;left:10%;right:10%;background:#1b3446e8;border-radius:12px;text-align:center;padding:12px;display:none}#overlay{position:fixed;inset:0;background:#142a3ccf;display:flex;align-items:center;justify-content:center;padding:25px}#panel{background:#f5dfb9;color:#3b2c24;padding:24px;border-radius:20px;max-width:360px;text-align:center;box-shadow:0 15px 50px #0008}#panel h2{margin:0 0 10px}#panel button{background:#b82c42;width:100%;margin-top:12px;font-size:18px}#panel p{line-height:1.5}</style></head><body><canvas id="c"></canvas><div id="hud"><div id="quest">🎯 Доберись до ворот</div><div id="state">👠 Жена ищет тебя</div></div><button id="pause" style="position:fixed;right:10px;top:75px;width:48px;height:44px;font-size:20px;z-index:3">⏸</button><div id="hearts" style="position:fixed;left:10px;top:76px;background:#213a42dc;border-radius:10px;padding:8px 12px;font-size:21px;pointer-events:none">❤️❤️❤️</div><div id="toast"></div><div id="controls"><span></span><button data-dir="up">↑</button><span></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><div id="actions"><button id="hide">🫣 Спрятаться</button><button id="run">🏃 Бежать</button></div><div id="overlay"><div id="panel"><h2>🏡 Побег из дома</h2><p>Ты — крошечный муж огромной великанши. Проберись к воротам, собери ключ и доберись до выхода. Жена сама ходит по двору и пытается поймать тебя!</p><p>Укрывайся за кустами. Кнопка «Бежать» ускоряет тебя, но жена быстрее замечает движение.</p><button id="start">Начать игру</button></div></div><script>
const spriteWife=new Image(),spriteHusband=new Image();spriteWife.src='assets/wife.svg';spriteHusband.src='assets/husband.svg';const c=document.getElementById('c'),g=c.getContext('2d'),quest=document.getElementById('quest'),state=document.getElementById('state'),toast=document.getElementById('toast'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
let W=innerWidth,H=innerHeight,playing=false,paused=false,lives=3,invulnerable=0,phase=0,hidden=false,sprint=false,caught=0,last=0,clock=0,noticeTime=0,manMoving=false,wifeMoving=false,manFacing=1,wifeFacing=1,captureTimer=0,capturePending=false,stamina=100,alertLevel=0;
const man={x:490,y:740},wife={x:460,y:390,tx:460,ty:390,mode:'patrol',timer:0},keys={};const gate={x:1400,y:220},key={x:1050,y:900},bushes=[{x:620,y:680,r:92},{x:890,y:510,r:95},{x:1170,y:680,r:90},{x:1040,y:1060,r:110},{x:340,y:1120,r:95},{x:1330,y:1060,r:95}];const trees=[{x:200,y:330},{x:800,y:220},{x:1370,y:850},{x:250,y:880}];const rnd=(a,b)=>a+Math.random()*(b-a),d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function say(t){toast.textContent=t;toast.style.display='block';noticeTime=clock+2.5}
function reset(){stamina=100;alertLevel=0;Object.keys(keys).forEach(k=>keys[k]=false);manFacing=1;wifeFacing=1;captureTimer=0;capturePending=false;lives=3;paused=false;document.getElementById('pause').textContent='⏸';document.getElementById('hearts').textContent='❤️❤️❤️';man.x=490;man.y=740;wife.x=460;wife.y=390;wife.mode='patrol';wife.timer=0;phase=0;hidden=false;sprint=false;playing=true;overlay.style.display='none';updateHud();say('Тихо! Жена вышла во двор...')}
function updateHud(){document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);quest.textContent=phase===0?'🎯 Найди ключ у сарая':phase===1?'🎯 Доберись до ворот':'🏆 Побег удался!';state.textContent=captureTimer>0?'👠 Жена несёт тебя домой':hidden?'🌿 Ты спрятался':wife.mode==='chase'?'🚨 Жена преследует!':wife.mode==='search'?'👀 Жена ищет тебя':'👠 Жена патрулирует'}
document.getElementById('start').onclick=reset;document.getElementById('pause').onclick=()=>{if(!playing)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶️':'⏸';say(paused?'Пауза':'Побег продолжается')};
document.getElementById('hide').onclick=()=>{if(!playing)return;const near=bushes.some(b=>d(man,b)<b.r+25);if(!near){say('Подойди к кустам, чтобы спрятаться');return}hidden=!hidden;say(hidden?'Тсс! Ты спрятался в кустах':'Ты вышел из укрытия');updateHud()};
document.getElementById('run').onpointerdown=e=>{e.preventDefault();sprint=true};document.getElementById('run').onpointerup=document.getElementById('run').onpointercancel=()=>sprint=false;
document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;const off=e=>{if(e)e.preventDefault();keys[k]=false;b.style.background='#264b65e9'};b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.style.background='#438d9e';try{b.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture','touchend'].forEach(ev=>b.addEventListener(ev,off,{passive:false}))});
document.addEventListener('visibilitychange',()=>{if(document.hidden){Object.keys(keys).forEach(k=>keys[k]=false);sprint=false;if(playing&&!paused){paused=true;document.getElementById('pause').textContent='▶️'}}});
onkeydown=e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){keys[k]=true;e.preventDefault()}if(e.key===' ')sprint=true};onkeyup=e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k)keys[k]=false;if(e.key===' ')sprint=false};
function end(win){playing=false;overlay.style.display='flex';panel.innerHTML=win?'<h2>🏆 Побег удался!</h2><p>Ты добрался до ворот и обхитрил великаншу. Но она уже планирует новую погоню!</p><button id="again">Сыграть ещё</button>':'<h2>👠 Попался!</h2><p>Огромная жена схватила тебя и унесла домой под мышкой. Попробуй спрятаться в кустах и обойти её!</p><button id="again">Попробовать снова</button>';document.getElementById('again').onclick=reset}
function update(dt){if(!playing||paused)return;clock+=dt;if(captureTimer>0){captureTimer-=dt;wifeMoving=true;wife.x+=(490-wife.x)*Math.min(1,dt*1.1);wife.y+=(390-wife.y)*Math.min(1,dt*1.1);if(captureTimer<=0){if(capturePending){end(false)}else{man.x=490;man.y=740;wife.x=460;wife.y=390;wife.mode='patrol';wife.timer=0;invulnerable=3;say('Снова дома! Осталось попыток: '+lives)}capturePending=false}return}invulnerable=Math.max(0,invulnerable-dt);if(clock>noticeTime)toast.style.display='none';let vx=(keys.right?1:0)-(keys.left?1:0),vy=(keys.down?1:0)-(keys.up?1:0),n=Math.hypot(vx,vy)||1;const moving=vx||vy;manMoving=!!moving;const fast=sprint&&stamina>1&&!!moving;stamina=cl(stamina+(fast?-33:19)*dt,0,100);const speed=fast?260:165;if(moving){if(vx)manFacing=vx>0?1:-1;hidden=false;man.x=cl(man.x+vx/n*speed*dt,60,1530);man.y=cl(man.y+vy/n*speed*dt,85,1330)}
if(phase===0&&d(man,key)<66){phase=1;say('🗝️ Ключ найден! Теперь к воротам');updateHud()}
if(phase===1&&d(man,gate)<85){end(true);return}
wife.timer-=dt;let dist=d(man,wife);const concealed=bushes.some(b=>d(man,b)<b.r*.78);const visible=!hidden&&!concealed&&(dist<(fast?510:360));alertLevel=cl(alertLevel+(visible?dt*1.6:-dt*.65),0,1);if(visible){wife.mode='chase';wife.tx=man.x;wife.ty=man.y;wife.timer=2.8}else if(wife.mode==='chase'&&wife.timer<=0){wife.mode='search';wife.timer=3}else if(wife.mode==='search'&&wife.timer<=0){wife.mode='patrol';wife.timer=0}
if(wife.mode==='patrol'&&wife.timer<=0){wife.tx=rnd(180,1400);wife.ty=rnd(200,1180);wife.timer=rnd(2,4)}
if(wife.mode==='chase'){wife.tx=man.x;wife.ty=man.y}
let dx=wife.tx-wife.x,dy=wife.ty-wife.y,dd=Math.hypot(dx,dy);wifeMoving=dd>4;if(Math.abs(dx)>5)wifeFacing=dx>0?1:-1;if(dd>4){let v=wife.mode==='chase'?205:95;wife.x+=dx/dd*Math.min(dd,v*dt);wife.y+=dy/dd*Math.min(dd,v*dt)}
if(dist<76&&!hidden&&!concealed&&invulnerable<=0){caught++;lives--;captureTimer=2.1;capturePending=lives<=0;wife.mode='caught';manMoving=false;sprint=false;Object.keys(keys).forEach(k=>keys[k]=false);say('👠 Попался! Жена несёт тебя домой под мышкой');updateHud();return}updateHud()}
function path(){g.fillStyle='#a9cb8c';g.fillRect(0,0,1600,1400);g.fillStyle='#e7c794';g.beginPath();g.moveTo(440,690);g.lineTo(480,750);g.lineTo(1050,900);g.lineTo(1420,230);g.lineTo(1470,230);g.lineTo(1100,970);g.lineTo(460,810);g.closePath();g.fill();g.fillStyle='#e6d6b5';g.fillRect(190,140,510,370);g.fillStyle='#bf664c';g.fillRect(170,115,550,75);g.fillStyle='#633c31';g.fillRect(460,405,100,105);g.fillStyle='#fff1cb';g.fillRect(250,230,100,90);g.fillStyle='#56808c';g.fillRect(263,242,74,67);g.fillStyle='#a57245';g.fillRect(960,760,200,160);g.fillStyle='#995738';g.fillRect(930,735,260,42);g.strokeStyle='#8b5b3c';g.lineWidth=24;g.strokeRect(40,40,1520,1320);g.strokeStyle='#4b8b58';g.lineWidth=10;for(let i=50;i<1560;i+=65){g.beginPath();g.moveTo(i,42);g.lineTo(i,72);g.stroke()}g.fillStyle='#794a32';g.fillRect(1340,100,22,220);g.fillRect(1500,100,22,220);g.fillStyle='#6d8c50';g.fillRect(1360,120,140,130);g.fillStyle='#c9b06d';g.font='bold 33px system-ui';g.fillText('ВЫХОД',1360,160)}

g.save();

for(let yy=185;yy<1010;yy+=29){for(let xx=420+(Math.floor(yy/29)%2)*24;xx<1520;xx+=49){const v=Math.sin(xx*.091+yy*.17);g.fillStyle=v>0?'#efd5a6':'#d9b68a';g.strokeStyle='#b99570';g.lineWidth=1.7;g.beginPath();g.roundRect(xx,yy,45,24,5);g.fill();g.stroke()}}g.restore();
// terracotta roof and roof tiles

g.fillStyle='#bd6545';for(let i=0;i<14;i++){g.beginPath();g.moveTo(175+i*39,110);g.lineTo(425,47);g.lineTo(192+i*39,110);g.fill()}

// detailed house windows, frame and flower boxes
for(const wx of [250,585]){g.fillStyle='#e8bb82';g.fillRect(wx-13,218,122,128);g.fillStyle='#6b9ca3';g.fillRect(wx,229,96,96);g.strokeStyle='#f7e7cb';g.lineWidth=7;g.strokeRect(wx,229,96,96);g.beginPath();g.moveTo(wx+48,229);g.lineTo(wx+48,325);g.moveTo(wx,277);g.lineTo(wx+96,277);g.stroke();g.fillStyle='#a86746';g.fillRect(wx-8,326,114,17);for(let j=0;j<7;j++){const px=wx+5+j*14;g.fillStyle=j%2?'#ee6990':'#f6d16d';g.beginPath();g.arc(px,322+(j%3)*2,8,0,7);g.fill()}}
// gate boards and hardware
g.fillStyle='#87503a';g.fillRect(1360,120,140,130);
for(let j=0;j<7;j++){g.fillStyle=j%2?'#995b3e':'#a96846';g.fillRect(1362+j*20,121,18,126)}
g.strokeStyle='#523b30';g.lineWidth=6;g.strokeRect(1360,120,140,130);g.beginPath();g.moveTo(1360,162);g.lineTo(1500,162);g.moveTo(1360,211);g.lineTo(1500,211);g.stroke();g.fillStyle='#e8b957';g.beginPath();g.arc(1482,193,5,0,7);g.fill();
// garden borders and flowering bushes
for(let i=0;i<85;i++){let xx=80+((i*131)%1450),yy=520+((i*97)%750);if(xx>390&&xx<1170&&Math.abs(yy-(690+(xx-440)*.24))<95)continue;const rr=4+(i%3)*2;g.fillStyle=i%4===0?'#fff5d6':i%3===0?'#f9d34d':'#ed6c8e';for(let p=0;p<5;p++){const a=p*Math.PI*2/5;g.beginPath();g.arc(xx+Math.cos(a)*rr,yy+Math.sin(a)*rr,rr*.65,0,7);g.fill()}g.fillStyle='#f9cb54';g.beginPath();g.arc(xx,yy,rr*.5,0,7);g.fill()}
}
function scenery(){gardenDetail();for(const a of trees){g.fillStyle='#72503a';g.fillRect(a.x-15,a.y-50,30,110);for(let j=0;j<4;j++){g.fillStyle=j%2?'#498b4c':'#6b9e4b';g.beginPath();g.arc(a.x+Math.sin(j*2)*38,a.y-90+Math.cos(j*2)*30,68,0,7);g.fill()}}for(const b of bushes){g.fillStyle='#367b45';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();g.fillStyle='#5caa5e';for(let j=0;j<5;j++){g.beginPath();g.arc(b.x+Math.sin(j*2.7)*b.r*.55,b.y+Math.cos(j*2.7)*b.r*.55,b.r*.4,0,7);g.fill()}}g.font='54px system-ui';g.fillText('🗝️',key.x-30,key.y);g.font='28px system-ui';g.fillStyle='#513f35';g.fillText('Сарай',990,970)}
function figure(x,y,large){const img=large?spriteWife:spriteHusband;if(img.complete&&img.naturalWidth){const height=large?310:115;const width=large?127:44;const moving=large?wifeMoving:manMoving;const t=clock*(large?8:13),bob=moving?Math.abs(Math.sin(t))*5:Math.sin(clock*2)*1.2,tilt=moving?Math.sin(t)*.028:0;g.save();g.fillStyle='#38281b44';g.beginPath();g.ellipse(x,y+13,large?48:17,large?13:6,0,0,Math.PI*2);g.fill();g.translate(x,y+16-bob);g.scale(large?wifeFacing:manFacing,1);g.rotate(tilt);g.drawImage(img,-width/2,-height,width,height);g.restore();return}g.save();g.translate(x,y);if(large){g.fillStyle='#3c302c';g.beginPath();g.ellipse(0,-180,46,56,0,0,7);g.fill();g.fillStyle='#f0a26b';g.beginPath();g.arc(0,-184,36,0,7);g.fill();g.fillStyle='#251d20';g.beginPath();g.arc(-12,-190,4,0,7);g.arc(12,-190,4,0,7);g.fill();g.strokeStyle='#6d2029';g.lineWidth=4;g.beginPath();g.moveTo(-12,-168);g.lineTo(10,-168);g.stroke();g.fillStyle='#d72b3d';g.beginPath();g.moveTo(-50,-130);g.quadraticCurveTo(-94,-15,-65,5);g.lineTo(65,5);g.quadraticCurveTo(94,-15,50,-130);g.closePath();g.fill();g.fillStyle='#fff1d5';for(let i=0;i<26;i++){let a=i*2.4;g.beginPath();g.arc(Math.sin(a)*52,-110+(i%6)*20,3.5,0,7);g.fill()}g.strokeStyle='#ed9b65';g.lineWidth=21;g.beginPath();g.moveTo(-45,-112);g.lineTo(-76,-48);g.moveTo(45,-112);g.lineTo(76,-48);g.stroke();g.strokeStyle='#f2a56e';g.lineWidth=28;g.beginPath();g.moveTo(-30,0);g.lineTo(-32,85);g.moveTo(30,0);g.lineTo(32,85);g.stroke();g.fillStyle='#c62535';g.fillRect(-49,76,34,17);g.fillRect(17,76,34,17);g.fillStyle='#e9b02d';g.beginPath();g.arc(-34,-175,8,0,7);g.arc(34,-175,8,0,7);g.fill();g.fillStyle='#d32638';for(let i=-2;i<=2;i++){g.beginPath();g.arc(i*11,-143,6,0,7);g.fill()}}else{g.fillStyle='#473027';g.fillRect(-15,-21,12,29);g.fillRect(3,-21,12,29);g.fillStyle='#f5f0e4';g.fillRect(-19,-80,38,62);g.fillStyle='#784a2c';g.fillRect(-20,-20,40,10);g.fillStyle='#b23c2b';g.beginPath();g.moveTo(-4,-77);g.lineTo(5,-77);g.lineTo(2,-38);g.closePath();g.fill();g.fillStyle='#efb280';g.beginPath();g.arc(0,-96,24,0,7);g.fill();g.fillStyle='#2c1e1b';g.beginPath();g.arc(0,-111,24,Math.PI,6.2);g.fill();g.fillStyle='#2d211d';g.fillRect(-13,-94,26,5);g.fillStyle='#fff';g.beginPath();g.arc(-8,-100,4,0,7);g.arc(8,-100,4,0,7);g.fill();g.fillStyle='#1f1816';g.beginPath();g.arc(-8,-100,2,0,7);g.arc(8,-100,2,0,7);g.fill()}g.restore()}
function render(){W=innerWidth;H=innerHeight;const ratio=Math.min(devicePixelRatio||1,2),cw=Math.round(W*ratio),ch=Math.round(H*ratio);if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch}g.setTransform(ratio,0,0,ratio,0,0);g.fillStyle='#c2dba8';g.fillRect(0,0,W,H);const zoom=Math.min(W/540,H/800)*.95;g.save();g.translate(W/2-man.x*zoom,H/2-man.y*zoom);g.scale(zoom,zoom);path();scenery();if(wife.mode==='chase'){g.strokeStyle='#e93d4a99';g.lineWidth=5;g.beginPath();g.arc(wife.x,wife.y,78+Math.sin(clock*9)*7,0,Math.PI*2);g.stroke();g.fillStyle='#b52335';g.font='bold 36px system-ui';g.fillText('!',wife.x-9,wife.y-325)}const drawMan=()=>{if(!hidden){if(invulnerable<=0||Math.floor(clock*6)%2===0)figure(man.x,man.y,false)}else{g.fillStyle='#fff';g.font='25px system-ui';g.fillText('👀',man.x-20,man.y-70)}};if(captureTimer>0){figure(wife.x,wife.y,true);g.save();g.translate(wife.x+wifeFacing*59,wife.y-184);g.rotate(wifeFacing*.36);g.scale(.67,.67);figure(0,0,false);g.restore();g.font='bold 27px system-ui';g.fillStyle='#a11d31';g.fillText('❤️',wife.x-20,wife.y-330)}else if(man.y<wife.y){drawMan();figure(wife.x,wife.y,true)}else{figure(wife.x,wife.y,true);drawMan()}g.restore();
const tx=phase===0?key.x:gate.x,ty=phase===0?key.y:gate.y,angle=Math.atan2(ty-man.y,tx-man.x);
const ox=W/2+Math.cos(angle)*Math.min(W*.29,110),oy=H/2+Math.sin(angle)*Math.min(H*.27,130);
g.save();g.translate(ox,oy);g.rotate(angle+Math.PI/2);g.fillStyle='#ffe27b';g.strokeStyle='#65401c';g.lineWidth=3;g.beginPath();g.moveTo(0,-18);g.lineTo(15,11);g.lineTo(-15,11);g.closePath();g.fill();g.stroke();g.restore();
g.fillStyle='#203945dd';g.fillRect(10,H*.17,Math.min(218,W*.54),64);g.fillStyle='white';g.font='bold 14px system-ui';g.fillText('🗝️ '+(phase?'Есть':'Нет')+'   👠 '+Math.round(d(man,wife)),18,H*.17+20);
g.font='12px system-ui';g.fillText('Бег',18,H*.17+39);g.fillStyle='#546977';g.fillRect(54,H*.17+29,Math.min(150,W*.37),11);g.fillStyle=stamina>25?'#6cdb91':'#f1b34b';g.fillRect(54,H*.17+29,Math.min(150,W*.37)*stamina/100,11);
g.fillStyle='#546977';g.fillRect(54,H*.17+45,Math.min(150,W*.37),9);g.fillStyle=alertLevel>.65?'#e95464':'#ffca69';g.fillRect(54,H*.17+45,Math.min(150,W*.37)*alertLevel,9);g.fillStyle='white';g.fillText('!',18,H*.17+54);
if(paused){g.fillStyle='#102b3caa';g.fillRect(0,0,W,H);g.textAlign='center';g.font='bold 30px system-ui';g.fillStyle='#fff1c6';g.fillText('ПАУЗА',W/2,H/2);g.textAlign='start'}
}
function loop(now){const dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
